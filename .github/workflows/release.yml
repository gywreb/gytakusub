name: Release extension zip
on:
  push:
    tags: ["v*"]
jobs:
  zip:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          v=$(node -p "require('./extension/manifest.json').version"); [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::manifest version $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build store zip
        run: ./scripts/build-zip.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
