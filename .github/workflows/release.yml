name: Release
# Triggered by scripts/release.mjs (pushes a vX.Y.Z tag), or by hand for an
# existing tag (Actions → Release → Run workflow, or
# `gh workflow run release.yml -f tag=v2.0.0`). Runs the full Tests workflow on
# the tagged commit first — the same environment as every push, so the two
# cannot drift apart — then builds the store zip, publishes a GitHub Release,
# and uploads + submits to the Chrome Web Store when the CWS_* secrets exist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v2.0.0"
        required: true
        type: string
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_CWS: ${{ secrets.CWS_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check version matches tag
        run: |
          v=$(node -p "require('./extension/manifest.json').version"); [ "v$v" = "$TAG" ] || { echo "::error::manifest version $v != tag $TAG"; exit 1; }
          echo "ZIP=dist/gytakusub-extension-$v.zip" >> "$GITHUB_ENV"
      - name: Build store zip
        # exactly one file: the release and the store upload must never pick up another zip
        run: |
          rm -rf dist
          ./scripts/build-zip.sh
          [ "$(ls dist)" = "$(basename "$ZIP")" ] || { echo "::error::dist/ holds $(ls dist), expected $(basename "$ZIP")"; exit 1; }
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ZIP }}
          generate_release_notes: true
      - name: Upload to Chrome Web Store and submit for review
        if: env.HAS_CWS == 'true'
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/cws-publish.mjs "$ZIP"
      - name: Skipped store upload
        if: env.HAS_CWS != 'true'
        run: echo "::notice::CWS secrets not set — zip attached to the GitHub Release only. See store/RELEASE-CHECKLIST.md § Automating updates."
