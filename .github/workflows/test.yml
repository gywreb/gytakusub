name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for f in extension/*.js web/*.js; do node --check "$f"; done
      - run: pip install --quiet pillow && cd tests && npm run demo # synthetic test page (fixtures/*.png are git-ignored)
      - run: cd tests && npm install --no-audit --no-fund && npm test
      # Real-browser test: the actual extension in headless Chrome against a mock API.
      - run: cd tests && npx playwright install --with-deps chrome
      - run: cd tests && npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-renders, path: /tmp/gyt-browser/**/*.png, if-no-files-found: ignore }
