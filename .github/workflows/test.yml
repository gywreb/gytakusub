name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for f in extension/*.js web/*.js; do node --check "$f"; done
      - run: cd tests && npm install --no-audit --no-fund && npm test
