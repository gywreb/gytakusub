name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "fetcher/worker.js", "fetcher/guide-sources.json", "extension/engine/**", "extension/vendor/**", "extension/prompt.js", "extension/text.js", "extension/fonts/**", "extension/icons/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The engine, vendored libraries, prompt/text modules, fonts and icons are
      # shared with the extension (extension/ is canonical) and copied in here
      # rather than committed twice.
      - run: ./scripts/sync-shared.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub's default is 10 minutes. On 2026-11-09, during GitHub's Actions incident, the
        # 78 MB site sat in "syncing files" past that twice; it normally deploys in under a minute.
        with: { timeout: 1800000 }
