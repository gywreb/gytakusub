name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
    # everything scripts/sync-shared.mjs copies into web/ (its strings and version too: 2.12.1 changed
    # only those and was not deployed)
    paths: ["web/**", "fetcher/worker.js", "fetcher/guide-sources.json", "extension/engine/**", "extension/vendor/**", "extension/prompt.js", "extension/usage.js", "extension/text.js", "extension/i18n.js", "extension/languages.js", "extension/_locales/**", "extension/manifest.json", "extension/fonts/**", "extension/icons/**", "extension/LICENSE", "extension/THIRD_PARTY.md", "scripts/sync-shared.mjs", "scripts/sync-shared.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Built and deployed in two jobs, as deploy-pages asks: in one job it looked the artifact up half a
  # second after the upload finished and found none (2026-11-25, twice: 3.2.0 and 3.2.2 not
  # deployed), and a re-run of that job uploads a second artifact, which deploy-pages refuses.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The engine, vendored libraries, prompt/text modules, fonts and icons are
      # shared with the extension (extension/ is canonical) and copied in here
      # rather than committed twice.
      - run: ./scripts/sync-shared.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub's default is 10 minutes. On 2026-11-09, during GitHub's Actions incident, the
        # 78 MB site sat in "syncing files" past that twice; it normally deploys in under a minute.
        with: { timeout: 1800000 }
