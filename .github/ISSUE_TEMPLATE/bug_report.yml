name: Something doesn't work
description: A translation fails, looks wrong, or Gytakusub behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Issues are public**, so please don't attach:
        - manga pages or screenshots of them (they're someone else's copyrighted work),
        - the *Export debug report* zip (it contains the page images),
        - your Claude API key, or anything that starts with `sk-ant-`.

        Describe what you saw in words. If a picture is really needed, crop it to the one bubble and say so; the developer may ask for more privately.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Browser extension
        - Web app (iPhone / Android / desktop)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Options → About shows it. For the web app, leave this empty.
      placeholder: "2.7.0"
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: "Brave 1.86 on Windows 11"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Claude model
      placeholder: "Haiku 5.5"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Copy any error message exactly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: The kind of page helps (long webtoon strip, Japanese vertical text, colour page…). Please don't post links to pages.
      placeholder: |
        1. Open a long webtoon chapter
        2. Turn on Auto-translate
        3. Scroll fast to the end
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I didn't attach manga pages, debug reports or my API key.
          required: true
