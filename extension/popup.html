<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gytakusub</title>
<link rel="stylesheet" href="ui.css" />
<style>
  body { width: 340px; }
  .pop-head { display: flex; align-items: center; gap: var(--s2); padding: 10px var(--s4); border-bottom: 1px solid var(--border); background: var(--surface); }
  .pop-title { margin: 0; font-weight: 700; font-size: 15px; }
  .master { margin-left: auto; display: flex; align-items: center; gap: var(--s2); cursor: pointer; color: var(--muted); font-size: var(--t-caption); font-weight: 600; }
  .pop-body { display: grid; gap: 10px; padding: var(--s3) var(--s4); }
  .actions { display: flex; gap: var(--s2); }
  .actions .primary { flex: 1; min-width: 0; }
  .icon-btn { flex: none; width: 40px; min-height: 40px; padding: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .status { min-height: 1.5em; margin-top: -2px; color: var(--muted); font-size: var(--t-caption); }
  .option { padding: var(--s2) 0; }
  .group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2); padding: var(--s1) var(--s3); }
  .group-title { margin: var(--s2) 0 0; font-size: var(--t-caption); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .group-title #host { text-transform: none; letter-spacing: 0; color: var(--fg); overflow-wrap: anywhere; }
  .group .field { padding: var(--s2) 0 10px; border-bottom: 1px solid var(--border); }
  .group .field + .option { border-top: 0; }
  .pop-foot { display: flex; gap: var(--s2); padding: 0 var(--s4) var(--s4); }
  .pop-foot .btn { flex: 1 1 auto; white-space: nowrap; }
  #nokey { margin: var(--s3) var(--s4) 0; }
  #offNote { padding: var(--s3) var(--s4) var(--s4); }
  body:not(.off) #offNote, body.off .pop-body { display: none; }
  /* until the settings are read (a few ms): never show the HTML defaults as if they were the user's */
  body:not(.ready) .switch, body:not(.ready) select, body:not(.ready) #enabledText { visibility: hidden; }
</style>
</head>
<body>
  <header class="pop-head">
    <img src="icons/icon32.png" width="22" height="22" alt="" />
    <h1 class="pop-title">Gytakusub</h1>
    <label class="master" title="Turn Gytakusub on or off on every site"><span id="enabledText">On</span><input type="checkbox" id="enabled" class="switch" aria-label="Gytakusub on" /></label>
  </header>

  <p id="offNote" class="hint">Gytakusub is off on every site. Turn it on with the switch above; your settings are kept.</p>

  <div id="nokey" class="notice" hidden><span>No Claude API key yet.</span><button id="openOptions2" class="btn small" type="button">Add key</button></div>

  <main class="pop-body">

    <div class="actions">
      <button id="translate" class="primary block" type="button"><span>Translate visible images</span><kbd id="kbdTranslate">Alt+T</kbd></button>
      <button id="toggle" class="btn icon-btn" type="button" title="Hide / show translations (Alt+Shift+T)" aria-label="Hide or show translations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p id="state" class="status" role="status" aria-live="polite"></p>

    <section class="group" aria-labelledby="siteHead">
      <h2 id="siteHead" class="group-title">On <span id="host">this site</span></h2>
      <label class="option">
        <span class="option-text"><span class="option-title">Enable here</span><span class="option-desc">Hover button and keyboard shortcuts</span></span>
        <input type="checkbox" id="site" class="switch" />
      </label>
      <label class="option">
        <span class="option-text"><span class="option-title">Auto-translate while scrolling</span><span class="option-desc">Sends pages to Claude as you scroll</span></span>
        <input type="checkbox" id="auto" class="switch" />
      </label>
    </section>

    <section class="group" aria-labelledby="trHead">
      <h2 id="trHead" class="group-title">Translation</h2>
      <label class="field">
        <span>Model</span>
        <select id="model">
          <option value="claude-haiku-5-5">Haiku 5.5 — fastest, cheapest</option>
          <option value="claude-sonnet-5-5">Sonnet 5.5 — better on dense pages</option>
          <option value="claude-opus-5-5">Opus 5.5 — best, most expensive</option>
        </select>
      </label>
      <label class="option">
        <span class="option-text"><span class="option-title">Chapter context</span><span class="option-desc">Names + recent lines, for continuity</span></span>
        <input type="checkbox" id="useContext" class="switch" />
      </label>
    </section>
  </main>

  <footer class="pop-foot">
    <button id="openOptions" class="btn" type="button">All settings</button>
    <button id="exportReport" class="btn" type="button" hidden title="One .zip with every translated page on this tab: original image, debug render and JSON">Export debug report</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
